<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="en">
<!--/*
  ======================================================================
  layout.html - PIECES SHARED BY EVERY PAGE
  ======================================================================
  This file is never shown on its own. It holds reusable pieces of HTML
  ("fragments") that the other pages copy in:

    head(title)     the <head>: page title, CSS, tab icon, dark-mode script
    nav(activeNav)  the navigation bar at the top
    toasts          the green/red pop-up messages ("Course created", errors)
    footer          the bottom of the page

  A page includes a fragment like this:

      <div th:replace="~{fragments/layout :: nav('courses')}"></div>

  which means: "replace this div with the 'nav' fragment from
  fragments/layout.html, and give it the value 'courses'".

  ----------------------------------------------------------------------
  THYMELEAF IN TWO MINUTES (applies to every page in /templates)
  ----------------------------------------------------------------------
  Before a page is sent to the browser, Thymeleaf fills it in on the server.
  Plain HTML is left alone. Attributes that start with "th:" are instructions:

    th:text="${course.title}"     put this value inside the tag
    th:if="${x}"                  only show this tag if x is true
    th:unless="${x}"              only show this tag if x is false
    th:each="c : ${courses}"      repeat this tag once for each item in the list
    th:href="@{/courses/{id}(id=${c.id})}"   build a link, e.g. /courses/7
    th:classappend="${ok} ? 'active'"        add a CSS class if the condition is true
    th:value, th:checked, th:action ...      set that HTML attribute

  Inside th: attributes:

    ${name}       a value the controller added with model.addAttribute("name", ...)
    ${c.title}    calls c.getTitle() on the Java object
    @{/path}      a link inside our app
    a ? b : c     "if a, then b, otherwise c"
    a ?: b        "a, or b if a is empty (null)"
    #temporals, #strings, #numbers   helper tools for dates, text and numbers

  The text written between tags (like "Course title" or "0") is just an
  example, so the file looks sensible when opened directly in a browser.
  Thymeleaf replaces it with the real value.

  Comments written in this style (with an extra slash and star at each end)
  are removed by Thymeleaf, so they never appear in the page students see.
  Normal HTML comments are sent to the browser as usual.
*/-->
<!--/* ================= HEAD: used by every page ================= */-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · GradeUp'">GradeUp</title>
    <meta name="description" content="GradeUp turns dense course handouts into simple key points and practice questions.">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5ae6'/><text y='70' x='50' text-anchor='middle' font-size='58' font-family='sans-serif' font-weight='bold' fill='white'>G</text></svg>">
    <!--/*
      Sets light or dark mode BEFORE the page is drawn, so it doesn't flash white
      first. It uses the choice saved by the theme button (see app.js), or the
      computer's own setting if nothing was saved yet.
    */-->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('gradeup-theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
</head>
<body>

<!-- ================= NAV ================= -->
<!--/*
  activeNav is the menu item to highlight: 'dashboard', 'courses', 'quiz' or 'history'.
  Each page passes it in, e.g. nav('courses').
*/-->
<nav class="nav" th:fragment="nav(activeNav)">
    <div class="container nav-inner">
        <a class="brand" th:href="@{/dashboard}">
            <span class="brand-mark" aria-hidden="true">G</span>
            <span>GradeUp</span>
        </a>

        <div class="nav-links">
            <a class="nav-link" th:href="@{/dashboard}"
               th:classappend="${activeNav == 'dashboard'} ? 'active'">Dashboard</a>
            <a class="nav-link" th:href="@{/courses}"
               th:classappend="${activeNav == 'courses'} ? 'active'">My Courses</a>
            <a class="nav-link" th:href="@{/quiz/start}"
               th:classappend="${activeNav == 'quiz'} ? 'active'">Practice</a>
            <a class="nav-link" th:href="@{/quiz/history}"
               th:classappend="${activeNav == 'history'} ? 'active'">Progress</a>
        </div>

        <div class="row">
            <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark theme">
                <svg data-icon-moon width="17" height="17" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <svg data-icon-sun width="17" height="17" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     style="display:none">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>
                </svg>
            </button>

            <!--/* The round badge with the user's initials (User.getInitials()). */-->
            <div class="avatar" th:if="${user != null}"
                 th:text="${user.initials}" th:title="${user.displayName}">AM</div>

            <!--/* Logging out is a POST form (not a link) so other websites can't log you out. */-->
            <form th:action="@{/logout}" method="post" class="inline-form">
                <button type="submit" class="btn btn-ghost btn-sm">Sign out</button>
            </form>
        </div>
    </div>
</nav>

<!-- ================= TOASTS ================= -->
<!--/*
  Pop-up messages. Controllers set them with
      redirect.addFlashAttribute("toast", "Course created.")   (green)
      redirect.addFlashAttribute("error", "That file is too big")  (red)
  app.js hides them again after a few seconds (anything marked data-toast).
*/-->
<div class="toast-wrap" th:fragment="toasts">
    <div class="alert alert-success" data-toast th:if="${toast}">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
        </svg>
        <span th:text="${toast}">Done</span>
    </div>
    <div class="alert alert-danger" data-toast th:if="${error}">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/>
        </svg>
        <span th:text="${error}">Something went wrong</span>
    </div>
</div>

<!-- ================= FOOTER ================= -->
<footer class="footer" th:fragment="footer">
    <div class="container footer-inner">
        <div class="row">
            <span class="brand-mark" style="width:26px;height:26px;font-size:12px" aria-hidden="true">G</span>
            <span>GradeUp — study smarter, not longer.</span>
        </div>
        <span class="text-xs">Built with Spring Boot &amp; Thymeleaf</span>
    </div>
</footer>

</body>
</html>
