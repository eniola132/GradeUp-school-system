<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="en">
<!--/*
  error/404.html - "NOT FOUND" PAGE
  Shown by GlobalExceptionHandler.handleNotFound() when something doesn't
  exist or belongs to another student.
  ${message} is the reason, e.g. "That course doesn't exist."
*/-->
<head th:replace="~{fragments/layout :: head('Not found')}"></head>
<body>
<main class="page">
    <div class="container container-narrow text-center" style="padding-top:var(--s16)">
        <div class="empty-icon" style="margin-bottom:var(--s6)">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>
            </svg>
        </div>
        <h1>We couldn't find that</h1>
        <p class="text-muted"
           th:text="${message} ?: 'The page or resource you were looking for doesn\'t exist.'">
            Not found.
        </p>
        <div class="row mt-8" style="justify-content:center">
            <a class="btn btn-primary" th:href="@{/dashboard}">Back to dashboard</a>
            <a class="btn btn-secondary" th:href="@{/courses}">My courses</a>
        </div>
    </div>
</main>
</body>
</html>
