<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="en">
<!--/*
  quiz/history.html - ALL PAST QUIZZES  ( /quiz/history )
  Shown by QuizController.history().
  Values it receives:
    attempts   every quiz the student has taken, newest first
*/-->
<head th:replace="~{fragments/layout :: head('Progress')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav('history')}"></div>
<div th:replace="~{fragments/layout :: toasts}"></div>

<main class="page">
    <div class="container">

        <div class="row-between mb-6">
            <div>
                <h1 class="mb-2">Your progress</h1>
                <p class="text-muted mb-0">Every practice quiz you've completed.</p>
            </div>
            <a class="btn btn-primary" th:href="@{/quiz/start}">Start a new quiz</a>
        </div>

        <div class="empty" th:if="${attempts.isEmpty()}">
            <div class="empty-icon">
                <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/>
                </svg>
            </div>
            <h3>No results yet</h3>
            <p>Once you complete a practice quiz, your scores will show up here so you can track improvement.</p>
            <a class="btn btn-primary" th:href="@{/quiz/start}">Take your first quiz</a>
        </div>

        <div class="card card-flush" th:unless="${attempts.isEmpty()}">
            <table class="table">
                <thead>
                <tr>
                    <th>Course</th>
                    <th>Date</th>
                    <th>Score</th>
                    <th>Grade</th>
                    <th class="text-right">Review</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${attempts}">
                    <td>
                        <div class="font-bold" th:text="${a.course.code}">CODE</div>
                        <div class="text-xs text-subtle truncate" th:text="${a.course.title}">Title</div>
                    </td>
                    <td class="text-sm text-muted"
                        th:text="${#temporals.format(a.startedAt, 'd MMM yyyy, HH:mm')}">date</td>
                    <td>
                        <div class="row">
                            <span class="badge" th:classappend="${a.passed} ? 'badge-mint' : 'badge-rose'"
                                  th:text="${a.percentage} + '%'">0%</span>
                            <span class="text-xs text-subtle"
                                  th:text="${a.score} + '/' + ${a.totalQuestions}">0/0</span>
                        </div>
                    </td>
                    <td><span class="font-bold" th:text="${a.gradeLetter}">B</span></td>
                    <td class="text-right">
                        <a class="btn btn-secondary btn-sm"
                           th:href="@{/quiz/results/{id}(id=${a.id})}">View</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
